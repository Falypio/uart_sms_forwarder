database:
  enabled: true
  type: sqlite
  sqlite:
    path: "./data/app.db"
  show_sql: false
log:
  level: debug # 日志等级  debug,info,waring,error
  filename: ./logs/sms.log

server:
  addr: "0.0.0.0:8080"
  ip_extractor: "X-Real-IP"

App:
  # JWT配置
  JWT:
    # 随机生成一个 32 字节的字符串，推荐使用 openssl rand -base64 32 生成
    Secret: ""
    ExpiresHours: 168 # 7天
  Users:
    # 使用 bcrypt 哈希；示例密码为 admin123，部署前用 htpasswd -nB -C 12 admin 生成并替换
    admin: "$2y$12$7DXcOiX1D59xNTIn5riUKusAPLP88LxxoczWmUT83MBj5EFznbp8a"
  OIDC:
    Enabled: false
    Issuer: ""
    ClientID: ""
    ClientSecret: ""
    RedirectURL: "http://localhost:8080/oidc/callback"

  # 串口配置
  Serial:
    # 容器中可见的所有串口会在启动及定时扫描；显式 Ports 优先于 Port。
    Disabled: false
    Port: ""
    Ports: []
    ScanIntervalSeconds: 10
  MQTT:
    Enabled: true
    Broker: "tcp://sms_mqtt:1883"
    ClientID: "sms_backend"
    Username: "sms_backend"
    Password: "REPLACE_WITH_STRONG_BACKEND_PASSWORD"
    TLS: false
    CAFile: ""
    TopicPrefix: "sms/v1/devices"
    PrivateKeyFile: "./data/keys/server_private.pem"
    KeyID: "server-key-1"
    OfflineSeconds: 180
