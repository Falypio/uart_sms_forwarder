%% Backend is the only account allowed to subscribe across devices or publish commands.
{allow, {username, "sms_backend"}, subscribe, ["sms/v1/devices/+/register", "sms/v1/devices/+/events", "sms/v1/devices/+/results", "sms/v1/devices/+/status"]}.
{allow, {username, "sms_backend"}, publish, ["sms/v1/devices/+/down"]}.
%% Device username MUST equal the device_id configured in Lua.
{allow, all, subscribe, ["sms/v1/devices/${username}/down"]}.
{allow, all, publish, ["sms/v1/devices/${username}/register", "sms/v1/devices/${username}/events", "sms/v1/devices/${username}/results", "sms/v1/devices/${username}/status"]}.
{deny, all}.
