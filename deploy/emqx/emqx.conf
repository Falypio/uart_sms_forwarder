# This file replaces the image's emqx.conf, so required node settings must be retained.
# node.cookie is supplied by EMQX_NODE__COOKIE in docker-compose.backend.yml.
node {
  name = "emqx@sms_mqtt"
  data_dir = "/opt/emqx/data"
}

# Dashboard uses port 18083 INSIDE the container; the host mapping may use 18084.
dashboard.listeners.http.bind = "0.0.0.0:18083"

listeners.tcp.default.bind = "0.0.0.0:1883"
# TLS stays disabled until real certificate/key and a port mapping are provided.
listeners.ssl.default.enable = false
listeners.ws.default.enable = false
listeners.wss.default.enable = false

authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
    password_hash_algorithm { name = sha256, salt_position = suffix }
    bootstrap_file = "/opt/emqx/etc/users.csv"
    bootstrap_type = plain
  }
]

authorization {
  no_match = deny
  deny_action = disconnect
  sources = [{ type = file, enable = true, path = "/opt/emqx/etc/acl.conf" }]
}
